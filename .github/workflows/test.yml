name: API 自动化测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync

      - name: 启动被测服务并等待就绪
        run: |
          uv run python mock_server/server.py &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:8100/api/v1/_debug/users; then
              echo "服务已就绪，探测 $i 次"
              exit 0
            fi
            sleep 1
          done
          echo "服务 30 秒内未就绪，退出"
          exit 1

      - name: 运行接口测试
        run: uv run pytest -q
